[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
via_ir = true
solc_version = "0.8.28"

remappings = [
  "@chainlink/contracts/=lib/chainlink/contracts/",
  "@pythnetwork/pyth-sdk-solidity/=lib/pyth-sdk-solidity/",
]

# Deployment scripts write manifests with `vm.writeFile`, which requires explicit
# filesystem permissions. Without this, every script that writes a manifest reverts.
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"

[lint]
# Foundry's default severity set (high/medium/low) flags several patterns that are
# intentional in a strategy v0.9.0 vault. Everything not listed here is either fixed or
# annotated inline with `// forge-lint: disable-next-line(...)` plus a reason.
exclude_lints = [
  "calls-loop",             # strategy/source loops call out (price, balance, swap) by design
  "require-revert-in-loop", # validation loops revert with the offending element
  "uninitialized-local",    # false positive on `for (uint256 i; ...)` and `+=` accumulators
  "boolean-cst",            # false positive on `return (true, payload)` / `(false, "")`
  "block-timestamp",        # interval-driven keeper: timestamps are the feature
  "reentrancy-events",      # events intentionally follow external calls; all mutators are nonReentrant
]

[profile.ci]
verbosity = 3
