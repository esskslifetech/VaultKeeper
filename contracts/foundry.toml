[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
via_ir = true
solc_version = "0.8.28"

remappings = [
  "@chainlink/contracts/=lib/chainlink/contracts/",
  "@pythnetwork/pyth-sdk-solidity/=lib/pyth-sdk-solidity/",
]

# Deployment scripts write manifests with `vm.writeFile`, which requires explicit
# filesystem permissions. Without this, every script that writes a manifest reverts.
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"

[lint]
# Foundry 1.7.1 lint IDs. Timestamp comparisons are intentional in this keeper;
# unchecked transfer warnings are confined to tests that assert the transfer outcome.
# Production token movements use SafeERC20. Other findings must remain visible.
exclude_lints = [
  "block-timestamp",        # interval-driven keeper and oracle validity windows
  "erc20-unchecked-transfer", # test assertions intentionally exercise share transfers
]

[profile.ci]
verbosity = 3
